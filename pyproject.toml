[project]
name = "toy-agent"
version = "0.1.0"
description = "Conversational Agent Brain & Orchestrator for AI Toy"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Pawan Eswaran", email = "pawaneswaran19012006@gmail.com" }
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
voice = [
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "faster-whisper>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests requiring external services",
]
testpaths = ["tests"]
